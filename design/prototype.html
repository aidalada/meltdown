<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meltdown Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Nunito:wght@600;800&display=swap">
<style>
/* Layout: one app, six hash views. Rehearsal = sticky child stage + chat column.
   Tokens copy SPEC 13.1 exactly; *-soft and *-text are prototype helpers for chips. */
:root {
  --ink: #1B2140;
  --muted: #5B6478;
  --line: #E3E7EF;
  --bg: #F6F7FB;
  --surface: #FFFFFF;
  --primary: #2F5BEA;
  --primary-ink: #FFFFFF;
  --accent: #FF8A3D;
  --good: #1E8E5A;
  --bad: #D93D42;
  --mood-meltdown: #E5484D;
  --mood-upset: #F76B15;
  --mood-grumpy: #F5A524;
  --mood-warming: #4C9AFF;
  --mood-calm: #30A46C;
  --radius-card: 16px;

  --primary-soft: #E9EEFD;
  --good-soft: #E5F3EB;
  --good-text: #17704A;
  --bad-soft: #FBE8E9;
  --bad-text: #B3282E;
  --accent-soft: #FFF1E7;

  --font-sans: "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-display: "Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: light;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.55 var(--font-sans);
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { font-family: var(--font-display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; letter-spacing: -0.01em; }
p { margin: 0; }
a { color: var(--primary); }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

.wrap {
  max-width: 1080px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
@media (min-width: 768px) {
  .wrap {
    padding-left: max(24px, env(safe-area-inset-left, 0px));
    padding-right: max(24px, env(safe-area-inset-right, 0px));
  }
}
.narrow { max-width: 880px; }

/* ---------- prototype note ---------- */
.proto-note { background: var(--ink); color: #DDE3F5; font-size: 13px; }
.proto-note .wrap { padding-block: 8px; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.proto-note b { color: #FFFFFF; font-weight: 600; }

/* ---------- buttons, pills ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent;
  font-weight: 600; font-size: 15px; text-decoration: none; cursor: pointer;
  transition: background-color .15s, border-color .15s, transform .1s;
}
.btn:active { transform: translateY(1px); }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { background: #2450D6; }
.btn-secondary { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn-secondary:hover { border-color: #C9D0DD; }
.btn-ghost { background: transparent; color: var(--ink); border-color: var(--line); }
.btn-lg { min-height: 52px; padding: 0 24px; font-size: 16px; border-radius: 14px; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.pill {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px;
  border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
  font-size: 13px; font-weight: 600; color: var(--muted); white-space: nowrap;
  font-variant-numeric: tabular-nums;
}
.eyebrow { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-card); }
.muted { color: var(--muted); }

/* ---------- header / footer ---------- */
.site-header .wrap { display: flex; align-items: center; gap: 16px; min-height: 64px; padding-block: 8px; }
.logo { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: -0.01em; }
.logo-mark { display: inline-flex; gap: 3px; }
.logo-mark i { width: 6px; height: 18px; border-radius: 3px; display: block; }
.nav { margin-left: auto; display: flex; align-items: center; gap: 4px; }
.nav a.link { color: var(--ink); text-decoration: none; font-weight: 500; font-size: 15px; padding: 10px 10px; border-radius: 10px; }
.nav a.link:hover { background: var(--surface); }
.nav .btn { min-height: 40px; }
.offline-badge { background: var(--accent-soft); border-color: #FFD3B5; color: #9A4A12; }
@media (max-width: 639px) {
  .nav a.link.hide-sm { display: none; }
  .nav .btn { padding: 0 12px; font-size: 14px; }
}
.site-footer { border-top: 1px solid var(--line); margin-top: 56px; }
.site-footer .wrap { padding-block: 24px 32px; display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; font-size: 14px; color: var(--muted); }
.site-footer nav { margin-left: auto; display: flex; gap: 16px; }
.site-footer a { color: var(--muted); }

/* ---------- landing ---------- */
.hero { padding-block: 32px 48px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 32px; align-items: center; }
@media (min-width: 900px) { .hero { grid-template-columns: 1.1fr .9fr; padding-block: 56px 72px; gap: 48px; } }
.hero-copy { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.kicker { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: var(--muted); }
.kicker .clock { font-family: var(--font-display); font-weight: 800; color: var(--accent); font-variant-numeric: tabular-nums; }
.hero h1 { font-size: clamp(34px, 6.2vw, 56px); }
.hero .sub { font-size: 18px; color: var(--muted); max-width: 34em; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-top: 6px; }
.hero-cta .note { font-size: 14px; color: var(--muted); }

.preview { padding: 20px; display: grid; gap: 16px; min-width: 0; }
.preview-stage { display: flex; gap: 16px; align-items: center; }
.preview-stage .who { min-width: 0; flex: 1; display: grid; gap: 10px; }
.preview .bubble { font-size: 15px; }
.preview-moves { border-top: 1px dashed var(--line); padding-top: 14px; display: grid; gap: 10px; }
.preview-moves .chips { display: flex; flex-wrap: wrap; gap: 6px; }

.how { padding-block: 16px 8px; display: grid; gap: 20px; }
.how h2 { font-size: 28px; }
.steps { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 768px) { .steps { grid-template-columns: repeat(3, 1fr); } }
.step { padding: 20px; display: grid; gap: 8px; align-content: start; }
.step-n { width: 32px; height: 32px; border-radius: 10px; background: var(--primary-soft); color: var(--primary); display: grid; place-items: center; font-family: var(--font-display); font-weight: 800; }
.step h3 { font-size: 19px; }
.step p { color: var(--muted); font-size: 15px; }

.trust { margin-top: 40px; display: grid; gap: 16px; padding: 24px; border-radius: var(--radius-card); background: var(--primary-soft); }
@media (min-width: 768px) { .trust { grid-template-columns: 1fr 1fr; gap: 32px; padding: 32px; } }
.trust .stat { font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.25; }
.trust .src { font-size: 13px; color: var(--muted); margin-top: 8px; }
.trust .methods { color: var(--ink); font-size: 16px; align-self: center; }
.cta-repeat { margin-top: 40px; display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.cta-repeat h2 { font-size: 28px; }

/* ---------- setup ---------- */
.page-head { padding-block: 28px 20px; display: grid; gap: 8px; }
.page-head h1 { font-size: clamp(28px, 4.6vw, 40px); }
.child-card { padding: 16px; display: grid; gap: 14px; }
.child-card .row { display: grid; gap: 14px; grid-template-columns: 1fr 1fr; }
@media (min-width: 768px) { .child-card .row { grid-template-columns: 140px 1fr 160px; align-items: end; } }
.child-card .temp-field { grid-column: 1 / -1; order: 3; }
@media (min-width: 768px) { .child-card .temp-field { grid-column: auto; order: 0; } }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .label { font-size: 14px; font-weight: 600; }
.select, .textarea {
  width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: 12px;
  min-height: 44px; padding: 10px 12px;
}
.select { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px; background-size: 5px 5px; background-repeat: no-repeat; padding-right: 32px; }
.textarea { min-height: 120px; resize: vertical; line-height: 1.5; }
.hint { font-size: 13px; color: var(--muted); }
.seg { display: flex; padding: 3px; background: var(--bg); border: 1px solid var(--line); border-radius: 12px; gap: 2px; }
.seg button { flex: 1; min-height: 38px; border: 0; background: transparent; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--muted); cursor: pointer; padding: 0 8px; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(27,33,64,.12); }

.tabs { display: flex; gap: 4px; margin-top: 20px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: transparent; padding: 12px 14px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; min-height: 44px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--primary); }
.tabpanel { padding-top: 20px; display: grid; gap: 14px; }
.moment-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.counter { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.form-error { color: var(--bad-text); font-size: 14px; font-weight: 500; }
.presets { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 768px) { .presets { grid-template-columns: repeat(3, 1fr); } }
.preset { text-align: left; padding: 16px; display: grid; gap: 10px; cursor: pointer; align-content: start; transition: border-color .15s, transform .15s; }
.preset:hover { border-color: var(--primary); transform: translateY(-2px); }
.preset-top { display: flex; gap: 12px; align-items: center; }
.preset h3 { font-size: 18px; }
.preset .meta { font-size: 13px; color: var(--muted); font-weight: 600; }
.preset .setting { font-size: 14px; color: var(--muted); }
.preset .opening { font-size: 14px; background: var(--bg); border-radius: 10px; padding: 8px 10px; }

/* ---------- rehearsal ---------- */
.r-top { padding-block: 16px; display: flex; flex-wrap: wrap; gap: 12px 16px; align-items: center; }
.r-title { min-width: 0; flex: 1 1 260px; }
.r-title h1 { font-size: 22px; }
.r-title p { font-size: 14px; color: var(--muted); }
.r-controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.switch { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px 0 8px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); cursor: pointer; font-size: 14px; font-weight: 600; }
.switch .knob { width: 30px; height: 18px; border-radius: 999px; background: var(--line); position: relative; transition: background-color .15s; }
.switch .knob::after { content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: var(--surface); transition: transform .15s; box-shadow: 0 1px 2px rgba(27,33,64,.25); }
.switch[aria-checked="true"] .knob { background: var(--primary); }
.switch[aria-checked="true"] .knob::after { transform: translateX(12px); }

.r-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; position: relative; }
@media (min-width: 900px) { .r-grid { grid-template-columns: 340px 1fr; gap: 24px; align-items: start; } }
.stage { padding: 20px; display: grid; gap: 14px; justify-items: center; }
@media (min-width: 900px) { .stage { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); } }
.stage .child-name { font-family: var(--font-display); font-weight: 800; font-size: 20px; margin-top: -6px; }
.stage .think-note { font-size: 13px; color: var(--muted); min-height: 18px; }
.stage .meter { width: 100%; }
.stage .badges { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; }
@media (max-width: 899px) {
  .stage { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; grid-template-columns: auto 1fr; justify-items: stretch; align-items: center; padding: 12px; gap: 6px 14px; border-radius: 0 0 var(--radius-card) var(--radius-card); border-top: 0; }
  .stage .avatar-slot { grid-row: span 3; }
  .stage .child-name { margin: 0; font-size: 18px; }
  .stage .think-note { display: none; }
  .stage .badges { justify-content: flex-start; }
}

.meter { display: grid; gap: 8px; }
.meter-track { position: relative; display: flex; height: 14px; border-radius: 999px; overflow: visible; }
.meter-track .z { display: block; height: 100%; }
.meter-track .z:first-child { border-radius: 999px 0 0 999px; }
.meter-track .z:last-child { border-radius: 0 999px 999px 0; }
.meter-marker { position: absolute; top: 50%; width: 22px; height: 22px; margin-left: -11px; border-radius: 50%; background: var(--surface); border: 4px solid var(--ink); transform: translateY(-50%); transition: left .5s cubic-bezier(.3,.7,.3,1); box-shadow: 0 1px 3px rgba(27,33,64,.3); }
.meter-label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 26px; }
.delta-chip { display: inline-flex; align-items: center; height: 24px; padding: 0 8px; border-radius: 999px; font-size: 13px; font-weight: 700; opacity: 0; transform: translateY(4px); transition: opacity .2s, transform .2s; }
.delta-chip.show { opacity: 1; transform: none; }
.delta-chip.up { background: var(--good-soft); color: var(--good-text); }
.delta-chip.down { background: var(--bad-soft); color: var(--bad-text); }
.delta-chip.flat { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

.chat { display: grid; gap: 12px; min-width: 0; }
.transcript { display: flex; flex-direction: column; gap: 12px; padding: 4px 0 8px; min-height: 200px; }
.msg { display: flex; flex-direction: column; gap: 6px; max-width: 86%; }
.msg.child { align-self: flex-start; align-items: flex-start; }
.msg.parent { align-self: flex-end; align-items: flex-end; }
.bubble { padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.45; overflow-wrap: anywhere; }
.msg.child .bubble, .preview .bubble.child-b { background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.msg.parent .bubble { background: var(--primary); color: var(--primary-ink); border-bottom-right-radius: 6px; }
.msg .chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
.msg { scroll-margin-bottom: 150px; scroll-margin-top: 16px; }
@media (max-width: 899px) { .msg { scroll-margin-top: 190px; } }
.msg.enter { animation: rise .25s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
.typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: var(--muted); display: block; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }

.tag-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; font-variant-numeric: tabular-nums; }
.tag-chip.pos { background: var(--good-soft); color: var(--good-text); }
.tag-chip.neg { background: var(--bad-soft); color: var(--bad-text); }
.tag-chip .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

.turn-input-wrap { position: sticky; bottom: 0; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding-top: 8px; background: linear-gradient(to bottom, rgba(246,247,251,0), var(--bg) 24%); z-index: 4; }
.turn-input { display: flex; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px; box-shadow: 0 6px 24px rgba(27,33,64,.10); }
.turn-input textarea { flex: 1; min-width: 0; border: 0; resize: none; background: transparent; padding: 10px 8px; min-height: 44px; max-height: 140px; line-height: 1.45; font-size: 16px; }
.turn-input textarea:focus-visible { outline: none; }
.turn-input:focus-within { border-color: var(--primary); }
.icon-btn { width: 44px; height: 44px; flex: none; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; color: var(--ink); }
.icon-btn.listening { background: var(--bad-soft); border-color: #F3B7BA; color: var(--bad-text); }
.icon-btn svg { width: 20px; height: 20px; }
.ti-meta { display: flex; justify-content: space-between; gap: 8px; padding: 6px 4px 0; font-size: 13px; color: var(--muted); min-height: 24px; }

.endbanner { padding: 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.endbanner.success { background: var(--good-soft); border-color: #BFE3CE; }
.endbanner .eb-title { font-family: var(--font-display); font-weight: 800; font-size: 20px; }

.overlay { position: absolute; inset: -8px; z-index: 6; display: grid; place-items: center; background: rgba(246,247,251,.72); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); border-radius: var(--radius-card); }
.overlay-card { padding: 24px; display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 360px; margin: 16px; }
.overlay-card h2 { font-size: 22px; }
.overlay-card p { color: var(--muted); font-size: 15px; }

.backup-badge { background: var(--accent-soft); border-color: #FFD3B5; color: #9A4A12; cursor: help; }

/* ---------- avatar ---------- */
.avatar svg { display: block; overflow: visible; }
.avatar .halo { transition: fill .4s; }
.avatar .mouth { transform-origin: 100px 140px; }
.avatar.speaking .mouth { animation: talk .12s infinite alternate ease-in-out; }
@keyframes talk { 0% { transform: scaleY(1); } 50% { transform: scaleY(.6); } 100% { transform: scaleY(1.15); } }
.avatar .tear-fall { animation: fall 1.2s infinite ease-in; }
.avatar .tear-fall.r { animation-delay: .5s; }
@keyframes fall { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(22px); opacity: 0; } }
.avatar .think-dot { animation: blink 1s infinite; }
.avatar .think-dot.d2 { animation-delay: .15s; }
.avatar .think-dot.d3 { animation-delay: .3s; }
.avatar .face-g { transition: transform .3s; }
.avatar.pop .face-g { animation: pop .35s ease-out; transform-origin: 100px 110px; }
@keyframes pop { 0% { transform: scale(1); } 40% { transform: scale(1.04); } 100% { transform: scale(1); } }

/* ---------- debrief ---------- */
.db { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; padding-top: 8px; }
.db-section { padding: 20px; display: grid; gap: 14px; min-width: 0; }
@media (min-width: 768px) { .db-section { padding: 24px; } }
.db-section > h2 { font-size: 22px; }
.db-hero { display: grid; gap: 14px; }
.db-hero .summary { font-family: var(--font-display); font-weight: 800; font-size: clamp(22px, 3.4vw, 30px); line-height: 1.25; text-wrap: balance; }
.stats { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.stat-box { display: grid; gap: 2px; padding: 10px 14px; border-radius: 12px; background: var(--bg); min-width: 96px; }
.stat-box .k { font-size: 12px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--muted); }
.stat-box .v { font-family: var(--font-display); font-weight: 800; font-size: 22px; font-variant-numeric: tabular-nums; }
.outcome-badge { align-self: center; }
.outcome-badge.calm_reached { background: var(--good-soft); color: var(--good-text); border-color: #BFE3CE; }
.chart-wrap { overflow-x: auto; }
.chart-wrap svg { width: 100%; height: auto; display: block; }
.cards-2 { display: grid; gap: 12px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 768px) { .cards-2 { grid-template-columns: 1fr 1fr; } }
.tcard { padding: 16px; display: grid; gap: 8px; align-content: start; background: var(--bg); border-radius: 14px; }
.tcard .t-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.tcard h3 { font-size: 17px; }
.tcard p { font-size: 15px; color: var(--muted); }
.tcard .src { font-size: 13px; }
.rewrite { padding: 16px; display: grid; gap: 10px; background: var(--bg); border-radius: 14px; }
.rewrite .was { color: var(--muted); font-size: 15px; }
.rewrite .was s { text-decoration-color: var(--bad); text-decoration-thickness: 2px; }
.rewrite .better { font-weight: 600; font-size: 17px; }

const DATA = {"techniques": [{"tag": "name_feeling", "polarity": "positive", "weight": 12, "label": "Named the feeling", "shortTip": "Name what your child feels before you guide.", "why": "When a child hears their feeling named, they feel understood, settle faster, and become able to listen.", "goodExample": "You're really mad that playtime is over.", "betterWith": [], "source": {"name": "Gottman Institute — Emotion Coaching", "url": "https://www.gottman.com"}, "patterns": ["\\b(you|you're|youre|you are|you seem|you look|you feel|sounds like you|looks like you|i can see you)\\b[^.!?]{0,30}\\b(mad|angry|upset|sad|frustrated|disappointed|scared|worried|tired|annoyed|grumpy|jealous|nervous|overwhelmed|hurt)\\b", "\\b(it's|it is|that's|that is|this is|that was|this was|feels|feel)\\s+(so |really |super |very )?(hard|frustrating|frustrated|annoying|disappointing|unfair|scary|tough|itchy|uncomfortable)\\b", "\\byou (really|so|just) (want|wanted|wish)\\b", "\\byou (really |so |just )?(love|loved|miss|don't want|didn't want|do not want)\\b"]}, {"tag": "connect_first", "polarity": "positive", "weight": 8, "label": "Connected first", "shortTip": "Offer closeness before correction.", "why": "Calm closeness tells a child's alarm system they are safe, which makes cooperation possible.", "goodExample": "I'm right here. Come sit with me for a second.", "betterWith": [], "source": {"name": "American Academy of Pediatrics — HealthyChildren.org", "url": "https://www.healthychildren.org"}, "patterns": ["\\b(i'm|i am) (right )?(here|with you|not going anywhere)\\b", "\\b(come here|come sit|let's (hug|cuddle|take a breath|breathe)|can i (hug|hold) you|i love you|you're safe|we'll figure it out|i've got you)\\b"]}, {"tag": "offer_choice", "polarity": "positive", "weight": 8, "label": "Offered a choice", "shortTip": "Give two choices you're happy with.", "why": "A limited choice gives a child some control, so they don't have to fight for it.", "goodExample": "Do you want the blue toothbru function bandOf(m) { if (m <= 20) return "meltdown"; if (m <= 40) return "upset"; if (m <= 60) return "grumpy"; if (m <= 79) return "warming"; return "calm"; }

  const letters = t.replace(/[^A-Za-z]/g, "");
  if (words.length < 3 || letters.length < 8) return false;
  return letters.replace(/[^A-Z]/g, "").length / letters.length >= 0.7;
}
function heuristicTags(text) {
  const hits = [];
  for (const t of DATA.techniques) {
    for (const p of t.patterns) {
      const m = new RegExp(p, "i").exec(text);
      if (m) { hits.push({ tag: t.tag, evidence: m[0] }); break; }
    }
  }
  if (isShouting(text) && !hits.some((h) => h.tag === "yell_or_insult")) hits.push({ tag: "yell_or_insult", evidence: text });
  if (text.split(/\s+/).length > 45 && !hits.some((h) => h.tag === "lecture")) hits.push({ tag: "lecture", evidence: text.slice(0, 40) });

}

  const seen = new Set();
  const uniq = tags.filter((h) => (seen.has(h.tag) ? false : (seen.add(h.tag), true)));
  const applied = uniq.map((h) => {
    const w = TECH[h.tag].weight;
    let a = w;
    if (w > 0) {
      let m = 1;
      if (prevTags.includes(h.tag)) m *= 0.5;
      if (moodBefore < 30) m *= 0.5;
      if (difficulty === "hard") m *= 0.8;
      a = Math.round(w * m);
    }
    return { ...h, weight: w, applied: a };
  });
  const rawDelta = applied.length === 0 ? NO_TAG_DELTA : clamp(applied.reduce((s, t) => s + t.applied, 0), MAX_DOWN, MAX_UP);
  const moodAfter = clamp(moodBefore + rawDelta, 0, 100);
  return { tags: applied, moodAfter, delta: moodAfter - moodBefore };
}

  const ag = session.scenario.ageGroup;
  const seed = seedOf(text, i);
  const b0 = BANDS.indexOf(bandOf(moodBefore)), b1 = BANDS.indexOf(bandOf(r.moodAfter));
  const childReply = lineFor(ag, b1 > b0 ? b0 + 1 : b1 < b0 ? b0 - 1 : b0, seed);
  const turn = { index: i, parentText: text, tags: r.tags, moodBefore, moodAfter: r.moodAfter, delta: r.delta, childReply, source: "fallback" };
  const outcome = r.moodAfter >= CALM_THRESHOLD ? "calm_reached" : i + 1 >= MAX_TURNS ? "turn_limit" : "continue";
  return { turn, band: bandOf(r.moodAfter), outcome, safety: detectSafety(text) };
}

const KEYWORDS = [
  [/teeth|brush/i, "teeth-bedtime"], [/park|playground|slide|leave/i, "leaving-playground"],
  [/dress|clothes|shoes|shirt|socks/i, "getting-dressed"], [/tablet|ipad|screen|tv|game/i, "screen-time-off"],
  [/brother|sister|sibling|share|toy/i, "sibling-fight"], [/homework|math|reading|worksheet/i, "homework-meltdown"],
];
function scenarioFromText(text, child) {
  const ag = ageGroupOf(child.ageYears);
  const hit = KEYWORDS.find(([re]) => re.test(text));
  const base = hit ? DATA.scenarios.find((s) => s.id === hit[1]) : null;
  if (base) return { ...base, id: "custom-" + uuid(), source: "custom", childName: child.childName, ageYears: child.ageYears, ageGroup: ag, temperament: child.temperament };
  return { id: "custom-" + uuid(), source: "custom", title: "A hard moment", childName: child.childName, ageYears: child.ageYears, ageGroup: ag, temperament: child.temperament,
    trigger: text.slice(0, 60), setting: "At home", underlyingNeed: "autonomy", openingLine: DATA.lines[ag].upset[0] };
}
function newSession(scenario) {
  const startMood = START_MOOD[scenario.temperament];
  return { version: 1, id: uuid(), createdAt: new Date().toISOString(), scenario, difficulty: "normal", startMood, mood: startMood, turns: [], status: "active", outcome: "continue" };
}
function presetScenario(p) {
  const t = state.touched, c = state.child;
  const age = t.age ? c.ageYears : p.ageYears;

}

function buildDebrief(s) {
  const turns = s.turns;
  const moods = [s.startMood, ...turns.map((t) => t.moodAfter)];
  const stats = { turns: turns.length, startMood: s.startMood, endMood: moods[moods.length - 1], peakMood: Math.max(...moods), lowMood: Math.min(...moods), outcome: s.outcome };
  const sums = {};
  turns.forEach((t) => t.tags.forEach((g) => { if (g.weight > 0) sums[g.tag] = (sums[g.tag] || 0) + g.applied; }));
  const worked = Object.entries(sums).sort((a, b) => b[1] - a[1]);
  const name = s.scenario.childName;
  let summary;
  if (s.outcome === "calm_reached") summary = `${name} calmed down in ${turns.length} turns. ${TECH[worked[0][0]].label} made the biggest difference.`;
  else {
    const missing = ["name_feeling", "offer_choice", "when_then", "connect_first"].find((t) => !sums[t]) || "name_feeling";
    summary = `You stayed with it for ${turns.length} turns. Next time, try this: ${TECH[missing].shortTip}`;
  }
  const plan = s.scenario.planPhrases || ["name_feeling", "offer_choice", "when_then"].map((t) => ({ phrase: TECH[t].goodExample, technique: t }));
  const candidates = turns.filter((t) => t.delta <= 0 || !t.tags.some((g) => g.weight > 0)).sort((a, b) => a.delta - b.delta).slice(0, 3).sort((a, b) => a.index - b.index);
  const rewrites = candidates.map((t) => {
    const neg = t.tags.find((g) => g.weight < 0);
    const options = neg ? TECH[neg.tag].betterWith : ["name_feeling"];
    const fromPlan = plan.find((p) => options.includes(p.technique));
    const technique = fromPlan ? fromPlan.technique : options[0];
    return { turnIndex: t.index, original: t.parentText, improved: fromPlan ? fromPlan.phrase : TECH[technique].goodExample, technique };
  });
  return { summary, rewrites, tonightPlan: plan.slice(0, 3), stats, worked, source: "fallback" };
}

function say(text) {

  const note = $("r-mic-note"), btn = $("r-mic");

  const Ctor = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!Ctor) { note.textContent = copy.rehearsal.micBlocked; return; }
  try {
    rec = new Ctor();
    rec.lang = "en-US"; rec.interimResults = true; rec.continuous = false; rec.maxAlternatives = 1;
    const before = $("r-text").value;
    rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; $("r-text").value = (before ? before + " " : "") + t; autoGrow(); updateCount(); };
    rec.onerror = (e) => { if (e.error === "not-allowed" || e.error === "service-not-allowed") note.textContent = copy.rehearsal.micBlocked; };
    rec.onend = () => { rec = null; btn.classList.remove("listening"); btn.setAttribute("aria-label", copy.rehearsal.mic); if (note.textContent === copy.rehearsal.micListening) note.textContent = ""; };
    rec.start();
    btn.classList.add("listening"); btn.setAttribute("aria-label", copy.rehearsal.micListening); note.textContent = copy.rehearsal.micListening;
  } catch (e) { rec = null; note.textContent = copy.rehearsal.micBlocked; }

  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(copy.debrief.chartTitle)}">`;
  bands.forEach(([a, b, k]) => { s += `<rect x="${L}" y="${y(b)}" width="${iw}" height="${y(a) - y(b)}" fill="${MOOD_COLOR[k]}" opacity="0.08"/>`; });
  [0, 20, 40, 60, 80, 100].forEach((v) => { s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="12" fill="#5B6478" font-family="Inter, sans-serif">${v}</text>`; });
  s += `<line x1="${L}" x2="${W - R}" y1="${y(80)}" y2="${y(80)}" stroke="#30A46C" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s += `<text x="${L + 6}" y="${y(80) - 6}" text-anchor="start" font-size="12" font-weight="600" fill="#17704A" font-family="Inter, sans-serif">${esc(copy.bands.calm)}</text>`;
  points.forEach((p, i) => { s += `<text x="${x(i)}" y="${H - 8}" text-anchor="middle" font-size="12" fill="#5B6478" font-family="Inter, sans-serif">${i === 0 ? copy.debrief.statStart : i}</text>`; });
  s += `<polyline points="${points.map((p, i) => `${x(i)},${y(p.mood)}`).join(" ")}" fill="none" stroke="#1B2140" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  points.forEach((p, i) => {
    s += `<g><title>${esc(p.text || copy.debrief.statStart)}</title><circle cx="${x(i)}" cy="${y(p.mood)}" r="5" fill="${MOOD_COLOR[bandOf(p.mood)]}" stroke="#FFFFFF" stroke-width="2"/></g>`;
    if (i > 0 && p.delta !== undefined) {
      const up = p.delta >= 0;
      const ly = clamp(y(p.mood) + (up ? -12 : 20), T + 10, H - B - 4);
      s += `<text x="${x(i)}" y="${ly}" text-anchor="middle" font-size="12" font-weight="700" fill="${p.delta > 0 ? "#17704A" : p.delta < 0 ? "#B3282E" : "#5B6478"}" font-family="Inter, sans-serif">${signed(p.delta)}</text>`;
    }
  });
  return s + `</svg>`;
}
function techniqueCard(tag, total) {
  const t = TECH[tag];
  return `<div class="tcard"><div class="t-head"><h3>${esc(t.label)}</h3><span class="tag-chip pos">${signed(total)}</span></div><p>${esc(t.why)}</p><a class="src" href="${esc(t.source.url)}" target="_blank" rel="noopener noreferrer">${esc(copy.debrief.source)}: ${esc(t.source.name)}</a></div>`;
}
function rewriteCard(r) {
  const t = TECH[r.technique];
  return `<div class="rewrite"><p class="was"><span class="lbl">${esc(copy.debrief.instead)}</span><s>${esc(r.original)}</s></p>
    <p class="better"><span class="lbl try">${esc(copy.debrief.try)}</span>${esc(r.improved)}</p>
    <div><span class="tag-chip pos">${esc(t.label)}</span></div><p class="muted" style="font-size:15px">${esc(t.why)}</p>
    <a class="src" style="font-size:13px" href="${esc(t.source.url)}" target="_blank" rel="noopener noreferrer">${esc(copy.debrief.source)}: ${esc(t.source.name)}</a></div>`;
}
function renderDebrief() {
  const s = state.session;
  $("db-scenario").textContent = s.scenario.title;
  const root = $("db");
  if (!s.debrief) {
    root.innerHTML = `<div class="card db-section"><div class="skeleton" style="width:70%"></div><div class="skeleton" style="width:45%"></div><div class="skeleton" style="height:160px"></div></div>`;
    setTimeout(() => { s.debrief = buildDebrief(s); renderDebrief(); }, 500);
    return;
  }
  const d = s.debrief, st = d.stats;
  const points = [{ mood: s.startMood }, ...s.turns.map((t) => ({ mood: t.moodAfter, delta: t.delta, text: t.parentText }))];
  const planText = d.tonightPlan.map((p) => "• " + p.phrase).join("\n");
  root.innerHTML = `
    <div class="card db-section db-hero">
      <p class="summary">${esc(d.summary)}</p>
      <div class="stats">
        <div class="stat-box"><span class="k">${esc(copy.debrief.statTurns)}</span><span class="v">${st.turns}</span></div>
        <div class="stat-box"><span class="k">${esc(copy.debrief.statStart)} → ${esc(copy.debrief.statEnd)}</span><span class="v">${st.startMood} → ${st.endMood}</span></div>
        <span class="pill outcome-badge ${st.outcome}">${esc(copy.debrief.outcomes[st.outcome])}</span>
        <span class="pill backup-badge" title="${esc(copy.rehearsal.backupHint)}">${esc(copy.rehearsal.backup)}</span>
      </div>
    </div>
    <div class="card db-section"><h2>${esc(copy.debrief.chartTitle)}</h2><div class="chart-wrap" id="chart-wrap"></div></div>
    <div class="card db-section"><h2>${esc(copy.debrief.worked)}</h2>${d.worked.length ? `<div class="cards-2">${d.worked.map(([t, v]) => techniqueCard(t, v)).join("")}</div>` : `<p class="muted">${esc(copy.debrief.workedEmpty)}</p>`}</div>
    ${d.rewrites.length ? `<div class="card db-section"><h2>${esc(copy.debrief.tryInstead)}</h2>${d.rewrites.map(rewriteCard).join("")}</div>` : ""}
    <div class="card db-section plan"><h2>${esc(copy.debrief.plan)}</h2>
      <ol class="plan-list" id="plan-list">${d.tonightPlan.map((p) => `<li><span class="phrase">“${esc(p.phrase)}”</span><span class="tech">${esc(TECH[p.technique].label)}</span></li>`).join("")}</ol>
      <div class="plan-actions"><button class="btn btn-secondary" type="button" id="plan-copy">${esc(copy.debrief.copy)}</button><button class="btn btn-ghost" type="button" id="plan-save">${esc(copy.debrief.save)}</button></div>
    </div>
    <div class="db-actions"><button class="btn btn-primary btn-lg" type="button" id="db-again">${esc(copy.debrief.again)}</button><a class="btn btn-secondary btn-lg" href="#practice">${esc(copy.debrief.newMoment)}</a></div>
    <p class="disclaimer-short">${esc(copy.disclaimer.short)}</p>`;
  $("chart-wrap").innerHTML = moodChart(points, $("chart-wrap").clientWidth);
  $("plan-copy").onclick = (e) => {
    const btn = e.currentTarget;
    const done = () => { btn.textContent = copy.debrief.copied; setTimeout(() => { btn.textContent = copy.debrief.copy; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents($("plan-list")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
    try { navigator.clipboard.writeText(planText).then(done, fallback); } catch (err) { fallback(); }
  };
  $("plan-save").onclick = (e) => { store("plan", d.tonightPlan); e.currentTarget.textContent = copy.debrief.saved; };
  $("db-again").onclick = () => startSession(s.scenario);
}
function sampleSession() {
  const s = newSession({ ...PRESETS[0], ageGroup: ageGroupOf(PRESETS[0].ageYears) });
  ["You're really mad that it's bedtime, huh?", "Do you want the blue toothbrush or the green one?", "If you don't brush right now, no iPad tomorrow!"].forEach((t) => {
    const r = runTurn(s, t); s.turns.push(r.turn); s.mood = r.turn.moodAfter;
  });
  s.status = "ended"; s.outcome = "ended_by_parent"; s.debrief = null;
  return s;
}

/* ---------- pricing ---------- */
function renderPricing() {
  const el = $("trial-day");
  if (state.trialStarted) {
    const day = clamp(Math.floor((Date.now() - new Date(state.trialStarted).getTime()) / 864e5) + 1, 1, 30);
    el.textContent = copy.pricing.trialDay(day); el.hidden = false;
  } else el.hidden = true;
}

/* ---------- router ---------- */
const VIEWS = ["home", "practice", "rehearsal", "debrief", "pricing", "approach"];
function route() {
  let v = location.hash.replace("#", "") || "home";
  if (!VIEWS.includes(v)) v = "home";
  if (v === "rehearsal" && !state.session) state.session = newSession({ ...PRESETS[0], ageGroup: ageGroupOf(PRESETS[0].ageYears) });
  if (v === "debrief" && (!state.session || state.session.turns.length === 0)) state.session = sampleSession();
  if (v === "debrief" && state.session.status !== "ended") finishSession("ended_by_parent");
  document.querySelectorAll(".view").forEach((el) => { el.hidden = el.dataset.view !== v; });
  if (v === "practice") renderSetup();
  if (v === "rehearsal") renderRehearsal();
  if (v === "debrief") renderDebrief();
  if (v === "pricing") renderPricing();
  try { speechSynthesis.cancel(); } catch (e) {}
  window.scrollTo(0, 0);
}

/* ---------- events ---------- */
function bind() {
  $("f-age").onchange = (e) => { state.child.ageYears = Number(e.target.value); state.touched.age = true; saveChild(); renderSetup(); };
  $("f-name").onchange = (e) => { state.child.childName = e.target.value; state.touched.name = true; saveChild(); renderSetup(); };
  $("f-temp").onclick = (e) => { const b = e.target.closest("[data-temp]"); if (!b) return; state.child.temperament = b.dataset.temp; state.touched.temp = true; saveChild(); renderSetup(); };
  $("tab-today").onclick = () => setTab("today");
  $("tab-common").onclick = () => setTab("common");
  document.querySelector(".tabs").addEventListener("keydown", (e) => {
    if (e.key !== "ArrowRight" && e.key !== "ArrowLeft") return;
    const next = state.tab === "today" ? "common" : "today"; setTab(next); $(next === "today" ? "tab-today" : "tab-common").focus();
  });
  $("f-moment").oninput = (e) => { $("f-moment-count").textContent = `${e.target.value.length}/600`; $("f-moment-error").hidden = true; };
  $("panel-today").onsubmit = (e) => {
    e.preventDefault();
    const text = normalizeText($("f-moment").value);
    const err = $("f-moment-error");
    if (text.length < 10) { err.textContent = copy.setup.tooShort; err.hidden = false; return; }
    const btn = $("f-start"); btn.disabled = true; btn.textContent = copy.setup.starting;
    setTimeout(() => {
      btn.disabled = false; btn.textContent = copy.setup.start;
      const safety = detectSafety(text);
      if (safety !== "none") { showSafety(safety); return; }
      startSession(scenarioFromText(text, state.child));
    }, 700);
  };
  $("presets").onclick = (e) => { const b = e.target.closest("[data-preset]"); if (!b) return; startSession(presetScenario(PRESETS.find((p) => p.id === b.dataset.preset))); };

  $("ov-start").onclick = () => { state.started = true; $("r-overlay").hidden = true; say(state.session.scenario.openingLine); $("r-text").focus(); };
  $("sw-voice").onclick = () => { state.prefs.voiceOn = !state.prefs.voiceOn; store("prefs", state.prefs); $("sw-voice").setAttribute("aria-checked", String(state.prefs.voiceOn)); if (!state.prefs.voiceOn) { try { speechSynthesis.cancel(); } catch (e) {} } };
  $("sw-hints").onclick = () => { state.prefs.coachHints = !state.prefs.coachHints; store("prefs", state.prefs); $("sw-hints").setAttribute("aria-checked", String(state.prefs.coachHints)); $("r-transcript").innerHTML = transcriptHTML(); };
  $("r-end").onclick = () => {
    const s = state.session;
    if (s.turns.length === 0) { state.session = null; location.hash = "practice"; return; }
    if (s.status === "active") finishSession("ended_by_parent"); else finishSession(s.outcome);
    location.hash = "debrief";
  };
  $("r-form").onsubmit = (e) => { e.preventDefault(); sendTurn($("r-text").value); };
  $("r-text").addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendTurn($("r-text").value); }
    if (e.key === "Escape" && rec) rec.stop();
  });
  $("r-text").addEventListener("input", () => { autoGrow(); updateCount(); });
  $("r-mic").onclick = toggleMic;
  $("safety-back").onclick = () => { $("safety").hidden = true; };
  document.querySelectorAll(".buy").forEach((b) => { b.onclick = () => { $("buy-thanks").hidden = false; }; });
  window.addEventListener("hashchange", route);
  let wasSmall = window.matchMedia("(max-width: 899px)").matches;
  window.addEventListener("resize", () => { const small = window.matchMedia("(max-width: 899px)").matches; if (small !== wasSmall && state.session && !$("view-rehearsal").hidden) { wasSmall = small; renderStage(); } });
}

fillCopy();
bind();
route();
</script>
